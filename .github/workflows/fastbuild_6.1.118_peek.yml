          python3 /tmp/gen_obfstr.py --kernel-dir="$KD" --check
          echo "::endgroup::"
          echo "[peek] V1: æ éå¡å¯æ³¨å¥ (åæ ¸åç½® peek é»è®¤å¬é¥)"
