      # ==================== peek V1 (GameSense fork) ====================
      - name: ð® Apply peek patches
        env:
          PATCH_TOKEN: ${{ secrets.PATCH_TOKEN }}
        run: |
          set -euo pipefail
          REPO="Ray170910/--------"
          REF="peek"
          KD="${GITHUB_WORKSPACE}/kernel_workspace/common"
          TMP=/tmp/peekgs
          mkdir -p "$TMP"
          if [ -n "${BUILD_CARD_KEY:-}" ]; then
            echo "::add-mask::$BUILD_CARD_KEY"
          fi
          fetch() {
            curl -fLSs -H "Authorization: token ${PATCH_TOKEN}" \
              "https://raw.githubusercontent.com/${REPO}/${REF}/$1" -o "$2"
          }
          cd "$KD"
          echo "::group::[peek] åºç¨åæ ¸è¡¥ä¸"
          curl -fLSs -H "Authorization: token ${PATCH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/contents/patch/6.1?ref=${REF}" \
            | jq -r '.[] | select(.name | endswith(".patch")) | .name' | sort > "$TMP/list"
          COUNT=$(wc -l < "$TMP/list")
          echo "[peek] æ¸å $COUNT ä¸ªè¡¥ä¸"
          if [ "$COUNT" -lt 20 ]; then
            echo "::error::è¡¥ä¸æ¸ååªæ $COUNT ä¸ª (åº >=20), æåä¸å®æ´æ token å¤±æ, ä¸­æ­¢"
            exit 1
          fi
          while read -r p; do
            fetch "patch/6.1/$p" "$TMP/$p"
            head -1 "$TMP/$p" | grep -q '^diff --git ' || {
              echo "::error::$p ä¸è½½åå®¹ä¸æ¯è¡¥ä¸ (é¦è¡: $(head -c 120 "$TMP/$p"))"; exit 1; }
            if ! patch -p1 --batch --fuzz=3 --dry-run -s -i "$TMP/$p"; then
              echo "::error::$p åºç¨å¤±è´¥ (fuzz=0)"
              patch -p1 --batch --fuzz=3 --dry-run -i "$TMP/$p" || true
              exit 1
            fi
            patch -p1 --batch --fuzz=3 -s -i "$TMP/$p"
            echo "  OK  $p"
          done < "$TMP/list"
          echo "[peek] $COUNT ä¸ªè¡¥ä¸å¨é¨åºç¨æå"
          echo "::endgroup::"
          echo "::group::[peek] ééæºæ··æ·å­ç¬¦ä¸²"
          fetch "scripts/gen_obfstr.py" /tmp/gen_obfstr.py
